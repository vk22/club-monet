<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/user/data/www/club-monet.ru

    <Directory /var/www/user/data/www/club-monet.ru>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/clubmonet-error.log
    CustomLog ${APACHE_LOG_DIR}/clubmonet-access.log combined
</VirtualHost>
