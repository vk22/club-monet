services:
  web:
    build:
      context: .
      dockerfile: docker/php-apache/Dockerfile
    platform: linux/amd64
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:80"
    command: >
      sh -c "mkdir -p core/cache core/export core/import core/packages assets/components assets/images &&
      chmod -R a+rwX core/cache core/export core/import core/packages assets/components assets/images &&
      until php -r '$$s=@fsockopen(\"db\",3306); if ($$s) { fclose($$s); exit(0); } exit(1);'; do sleep 2; done &&
      apache2-foreground"
    volumes:
      - ./www:/var/www/user/data/www/club-monet.ru
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/zz-local.ini:ro
      - ./docker/apache/site.conf:/etc/apache2/sites-available/000-default.conf:ro

  db:
    image: mysql:5.7
    platform: linux/amd64
    command:
      - --character-set-server=utf8
      - --collation-server=utf8_unicode_ci
      - --max_allowed_packet=512M
      - --sql_mode=NO_ENGINE_SUBSTITUTION
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-monety}
      MYSQL_USER: ${MYSQL_USER:-monety}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - db-data:/var/lib/mysql
      - ./monety.sql:/docker-entrypoint-initdb.d/monety.sql:ro
      - ./docker/mysql/zzz-localize.sql:/docker-entrypoint-initdb.d/zzz-localize.sql:ro
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/local.cnf:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

volumes:
  db-data:
